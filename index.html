<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiosco Pro - Sincronizado</title>
    <style>
        :root { --p: #5d2a42; --a: #d4af37; --bg: #f4f6f8; --sidebar-w: 280px; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; min-height: 100vh; overflow-x: hidden; }
        
        .sidebar { width: var(--sidebar-w); background: white; box-shadow: 2px 0 15px rgba(0,0,0,0.06); display: flex; flex-direction: column; padding: 20px; position: fixed; height: 100vh; z-index: 1000; box-sizing: border-box; overflow-y: auto; }
        .sidebar-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--a); padding-bottom: 10px; }
        .sidebar-header h1 { font-size: 1.1rem; margin: 0; color: var(--p); letter-spacing: 1px; }
        
        .seccion { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .seccion h3 { font-size: 10px; color: #999; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        
        input, select, button { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; box-sizing: border-box; outline: none; }
        .btn-nav { background: #333; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-arc { background: #666; color: white; border: none; cursor: pointer; }
        .btn-add { background: var(--p); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-del { background: #ff7675; color: white; border: none; cursor: pointer; font-size: 10px; padding: 4px 8px; width: auto; margin-left: 10px; border-radius: 4px; }

        .main { flex: 1; margin-left: var(--sidebar-w); padding: 20px; width: calc(100% - var(--sidebar-w)); }
        
        #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .header-medio { grid-column: 1 / -1; font-size: 1.2rem; color: var(--p); border-left: 4px solid var(--a); padding-left: 12px; margin: 25px 0 12px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.5); padding: 8px 12px; border-radius: 0 8px 8px 0; }

        .card { background: white; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #eee; display: flex; flex-direction: column; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .card img { width: 100%; height: 130px; object-fit: cover; background: #f0f0f0; }
        .card-body { padding: 12px; flex-grow: 1; }
        .card-title { font-size: 0.85rem; font-weight: 700; margin: 0; line-height: 1.3; color: #1a1a1a; }
        
        .btn-accion { position: absolute; top: 8px; right: 8px; background: white; border-radius: 50%; width: 28px; height: 28px; border: none; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 14px; transition: 0.2s; }
        .btn-accion:hover { background: var(--a); color: white; transform: scale(1.1); }

        @media (max-width: 1400px) { #grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 850px) {
            .sidebar { transform: translateX(-100%); transition: 0.3s; }
            .sidebar.show { transform: translateX(0); }
            .main { margin-left: 0; width: 100%; padding: 15px; }
            #grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><h1>QUIOSCO CLOUD</h1></div>
        
        <div class="seccion">
            <h3>Navegación</h3>
            <button class="btn-nav" onclick="window.cambiarVista('ALL')">📰 Muro Principal</button>
            <button class="btn-arc" onclick="window.cambiarVista('LEIDAS')">👁️ Archivo de Leídas</button>
        </div>

        <div class="seccion">
            <h3>Filtros</h3>
            <select id="sel-tema" onchange="window.filtrarTema()"></select>
            <select id="sel-medio" onchange="window.filtrarMedio()"></select>
        </div>

        <div class="seccion">
            <h3>Añadir Medio</h3>
            <input type="text" id="in-tema" placeholder="Tema (ej: Semana Santa)">
            <input type="url" id="in-url" placeholder="URL RSS">
            <button class="btn-add" id="btn-save" onclick="window.añadirMedio()">+ Guardar en la Nube</button>
        </div>
        
        <div style="font-size: 9px; color: #ccc; text-align: center; margin-top: auto;">Firebase Sync v1.0</div>
    </aside>

    <main class="main">
        <div id="grid"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN PROPORCIONADA POR EL USUARIO
        const firebaseConfig = {
            apiKey: "AIzaSyBkzM8j9-uw8hrDimBF0ez2ER4j54Vk3Ko",
            authDomain: "mi-quiosco-48211.firebaseapp.com",
            databaseURL: "https://mi-quiosco-48211-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mi-quiosco-48211",
            storageBucket: "mi-quiosco-48211.firebasestorage.app",
            messagingSenderId: "802592583418",
            appId: "1:802592583418:web:18049524889955e403a343"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "medios");

        let fuentes = [];
        let leidas = JSON.parse(localStorage.getItem('q_leidas')) || [];
        let vista = 'ALL';
        let filtroVal = '';

        // ESCUCHA EN TIEMPO REAL
        onSnapshot(query(colRef, orderBy("fecha", "desc")), (snapshot) => {
            fuentes = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            actualizarMenus();
            cargar();
        });

        window.añadirMedio = async () => {
            const t = document.getElementById('in-tema').value.trim();
            const u = document.getElementById('in-url').value.trim();
            const btn = document.getElementById('btn-save');
            if(!t || !u) return;
            
            btn.innerText = "Conectando...";
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(u)}`);
                const data = await res.json();
                if(data.status === 'ok') {
                    await addDoc(colRef, { n: data.feed.title, t: t, u: u, fecha: Date.now() });
                    document.getElementById('in-url').value = '';
                    btn.innerText = "+ Guardar en la Nube";
                }
            } catch(e) { 
                alert("Error: Asegúrate de que es una URL de RSS válida."); 
                btn.innerText = "+ Guardar en la Nube";
            }
        };

        window.borrarMedio = async (id) => {
            if(confirm("¿Eliminar este medio de todos tus dispositivos?")) {
                await deleteDoc(doc(db, "medios", id));
            }
        };

        async function cargar() {
            const g = document.getElementById('grid');
            g.innerHTML = '';

            if (vista === 'LEIDAS') {
                g.innerHTML = '<div class="header-medio">Noticias Archivadas</div>';
                if(leidas.length === 0) g.innerHTML += '<p style="grid-column:1/-1; text-align:center; padding:40px; color:#999;">No hay noticias en el archivo.</p>';
                leidas.forEach(it => g.insertAdjacentHTML('beforeend', renderCard(it, true)));
                return;
            }

            let activas = (vista === 'ALL') ? fuentes : 
                         (vista === 'TEMA') ? fuentes.filter(f => f.t === filtroVal) :
                         fuentes.filter(f => f.u === filtroVal);

            if(fuentes.length === 0) {
                g.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:100px; color:#999;">Tu quiosco está vacío. Añade un medio en el panel lateral.</p>';
                return;
            }

            for (let f of activas) {
                try {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.u)}`);
                    const data = await res.json();
                    if (data.status === 'ok') {
                        g.insertAdjacentHTML('beforeend', `
                            <div class="header-medio">
                                <span>${f.n} <small style="font-size:10px; color:#999; margin-left:10px;">(${f.t})</small></span>
                                <button class="btn-del" onclick="window.borrarMedio('${f.id}')">Eliminar</button>
                            </div>`);
                        
                        const items = data.items.filter(it => !leidas.some(l => l.link === it.link)).slice(0, 10);
                        items.forEach(it => {
                            const img = it.thumbnail || (it.enclosure ? it.enclosure.link : '');
                            g.insertAdjacentHTML('beforeend', renderCard({titulo: it.title, link: it.link, medio: f.n, img: img}, false));
                        });
                    }
                } catch (e) {}
            }
        }

        function renderCard(it, esArchivo) {
            const tSeguro = it.titulo.replace(/['"“”]/g, ' ');
            const boton = esArchivo 
                ? `<button class="btn-accion" onclick="window.restaurar('${it.link}')" title="Restaurar">↩️</button>`
                : `<button class="btn-accion" onclick="window.archivar('${it.link}', '${tSeguro}', '${it.medio}', '${it.img}')" title="Marcar como leída">👁️</button>`;
            return `
                <div class="card">
                    ${boton}
                    <a href="${it.link}" target="_blank" onclick="${!esArchivo ? `window.archivar('${it.link}', '${tSeguro}', '${it.medio}', '${it.img}')` : ''}" style="text-decoration:none; color:inherit;">
                        ${it.img ? `<img src="${it.img}" loading="lazy">` : '<div style="height:130px; background:#eee"></div>'}
                        <div class="card-body">
                            <p class="card-title">${it.titulo}</p>
                        </div>
                    </a>
                </div>`;
        }

        window.archivar = (link, titulo, medio, img) => {
            if (!leidas.some(l => l.link === link)) {
                leidas.unshift({ link, titulo, medio, img });
                if(leidas.length > 50) leidas.pop();
                localStorage.setItem('q_leidas', JSON.stringify(leidas));
            }
            cargar();
        };

        window.restaurar = (link) => {
            leidas = leidas.filter(l => l.link !== link);
            localStorage.setItem('q_leidas', JSON.stringify(leidas));
            cargar();
        };

        window.cambiarVista = (v) => { vista = v; cargar(); };
        window.filtrarTema = () => { vista = 'TEMA'; filtroVal = document.getElementById('sel-tema').value; cargar(); };
        window.filtrarMedio = () => { vista = 'MEDIO'; filtroVal = document.getElementById('sel-medio').value; cargar(); };

        function actualizarMenus() {
            const st = document.getElementById('sel-tema');
            const sm = document.getElementById('sel-medio');
            st.innerHTML = '<option value="">Temas</option>';
            sm.innerHTML = '<option value="">Medios</option>';
            [...new Set(fuentes.map(f => f.t))].forEach(t => st.innerHTML += `<option value="${t}">${t}</option>`);
            fuentes.forEach(f => sm.innerHTML += `<option value="${f.u}">${f.n}</option>`);
        }
    </script>
</body>
</html>

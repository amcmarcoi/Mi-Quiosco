<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiosco Pro - Cloud Archive</title>
    <style>
        :root { --p: #5d2a42; --a: #d4af37; --bg: #f4f6f8; --sidebar-w: 280px; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: var(--sidebar-w); background: white; box-shadow: 2px 0 15px rgba(0,0,0,0.06); display: flex; flex-direction: column; padding: 20px; position: fixed; height: 100vh; z-index: 1000; box-sizing: border-box; overflow-y: auto; }
        .sidebar-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--a); padding-bottom: 10px; }
        .sidebar-header h1 { font-size: 1rem; color: var(--p); margin: 0; letter-spacing: 1px; }
        
        .seccion { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .seccion h3 { font-size: 10px; color: #999; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        
        input, select, button { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; box-sizing: border-box; outline: none; }
        .btn-nav { background: #333; color: white; font-weight: bold; cursor: pointer; border: none; }
        .btn-add { background: var(--p); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-csv { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-del { background: #ff7675; color: white; border: none; cursor: pointer; font-size: 10px; padding: 4px 8px; width: auto; margin-left: 10px; border-radius: 4px; }

        /* Main Content */
        .main { flex: 1; margin-left: var(--sidebar-w); padding: 20px; width: calc(100% - var(--sidebar-w)); }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .header-medio { grid-column: 1 / -1; font-size: 1.1rem; color: var(--p); border-left: 4px solid var(--a); padding: 8px 12px; margin: 20px 0 10px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.5); }

        .card { background: white; border-radius: 10px; overflow: hidden; position: relative; border: 1px solid #eee; display: flex; flex-direction: column; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .card img { width: 100%; height: 120px; object-fit: cover; background: #eee; }
        .card-body { padding: 12px; flex-grow: 1; }
        .card-title { font-size: 0.85rem; font-weight: 700; margin: 0; line-height: 1.3; color: #1a1a1a; }
        .card-meta { font-size: 10px; color: #888; margin-top: 8px; font-style: italic; }
        
        .btn-accion { position: absolute; top: 8px; right: 8px; background: white; border-radius: 50%; width: 28px; height: 28px; border: none; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 14px; }

        @media (max-width: 850px) {
            .sidebar { transform: translateX(-100%); transition: 0.3s; }
            .sidebar.show { transform: translateX(0); }
            .main { margin-left: 0; width: 100%; padding: 15px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><h1>QUIOSCO SEGURO</h1></div>
        
        <div class="seccion">
            <h3>Vistas</h3>
            <button class="btn-nav" onclick="window.cambiarVista('ALL')">📰 Muro RSS</button>
            <button class="btn-nav" style="background:var(--a); margin-top:5px;" onclick="window.cambiarVista('DISCOVER')">🌟 Discover (Excel)</button>
            <button class="btn-nav" style="background:#666; margin-top:5px;" onclick="window.cambiarVista('LEIDAS')">👁️ Archivadas</button>
        </div>

        <div class="seccion">
            <h3>Seguridad</h3>
            <input type="password" id="admin-pass" placeholder="Clave Maestra">
        </div>

        <div id="panel-rss" class="seccion">
            <h3>Añadir RSS</h3>
            <input type="text" id="in-tema" placeholder="Tema (ej: Deportes)">
            <input type="url" id="in-url" placeholder="URL RSS">
            <button class="btn-add" id="btn-save" onclick="window.añadirMedio()">+ Guardar RSS</button>
        </div>

        <div id="panel-discover" class="seccion" style="display:none;">
            <h3>Importar Discover</h3>
            <input type="file" id="csv-file" accept=".csv">
            <button class="btn-csv" onclick="window.importarCSV()">⬆️ Subir CSV</button>
        </div>
    </aside>

    <main class="main">
        <div id="grid"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBkzM8j9-uw8hrDimBF0ez2ER4j54Vk3Ko",
            authDomain: "mi-quiosco-48211.firebaseapp.com",
            projectId: "mi-quiosco-48211",
            storageBucket: "mi-quiosco-48211.firebasestorage.app",
            messagingSenderId: "802592583418",
            appId: "1:802592583418:web:18049524889955e403a343"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRSS = collection(db, "medios");
        const colDisc = collection(db, "discover");

        let fuentesRSS = [];
        let itemsDisc = [];
        let leidas = JSON.parse(localStorage.getItem('q_leidas')) || [];
        let vista = 'ALL';

        // Escuchas Firebase
        onSnapshot(query(colRSS, orderBy("fecha", "desc")), (snap) => {
            fuentesRSS = snap.docs.map(d => ({ ...d.data(), id: d.id }));
            if(vista === 'ALL') cargar();
        });

        onSnapshot(query(colDisc, orderBy("importFecha", "desc")), (snap) => {
            itemsDisc = snap.docs.map(d => ({ ...d.data(), id: d.id }));
            if(vista === 'DISCOVER') cargar();
        });

        // --- IMPORTADOR CSV INTELIGENTE ---
        window.importarCSV = () => {
            const pass = document.getElementById('admin-pass').value.trim();
            const file = document.getElementById('csv-file').files[0];
            if(!pass || !file) return alert("Falta clave o archivo.");

            const reader = new FileReader();
            reader.onload = async (e) => {
                const filas = parsearCSV(e.target.result);
                if (filas.length < 2) return alert("Archivo no válido.");

                const headers = filas[0].map(h => h.trim().toLowerCase());
                const idx = {
                    url: headers.indexOf('url'),
                    titulo: headers.indexOf('title'),
                    img: headers.indexOf('image'),
                    medio: headers.indexOf('publisher'),
                    cat: headers.indexOf('category')
                };

                let cont = 0;
                for(let i = 1; i < filas.length; i++) {
                    const col = filas[i];
                    if(col.length < 2 || !col[idx.url]) continue;
                    
                    await addDoc(colDisc, {
                        u: col[idx.url].trim(),
                        t: col[idx.titulo]?.trim() || 'Sin título',
                        img: col[idx.img]?.trim() || '',
                        m: col[idx.medio]?.trim() || 'Desconocido',
                        cat: col[idx.cat]?.trim() || 'General',
                        pass: pass,
                        importFecha: Date.now()
                    });
                    cont++;
                }
                alert(`✅ ${cont} noticias subidas a Discover.`);
            };
            reader.readAsText(file, 'UTF-8');
        };

        function parsearCSV(texto) {
            const resultado = [];
            let fila = [];
            let valor = "";
            let enComillas = false;
            for (let i = 0; i < texto.length; i++) {
                const char = texto[i];
                if (char === '"') enComillas = !enComillas;
                else if (char === ',' && !enComillas) { fila.push(valor); valor = ""; }
                else if (char === '\n' && !enComillas) { fila.push(valor); resultado.push(fila); fila = []; valor = ""; }
                else valor += char;
            }
            if (fila.length > 0) { fila.push(valor); resultado.push(fila); }
            return resultado;
        }

        // --- GESTIÓN RSS ---
        window.añadirMedio = async () => {
            const pass = document.getElementById('admin-pass').value.trim();
            const t = document.getElementById('in-tema').value.trim();
            const u = document.getElementById('in-url').value.trim();
            if(!pass || !t || !u) return alert("Faltan datos.");
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(u)}`);
                const data = await res.json();
                if(data.status === 'ok') {
                    await addDoc(colRSS, { n: data.feed.title, t, u, pass, fecha: Date.now() });
                    alert("✅ RSS Guardado.");
                }
            } catch(e) { alert("Error de clave o URL."); }
        };

        async function cargar() {
            const g = document.getElementById('grid'); g.innerHTML = '';
            
            if (vista === 'DISCOVER') {
                g.innerHTML = '<div class="header-medio">🌟 Explorar Discover (Archivo)</div>';
                itemsDisc.forEach(it => {
                    g.insertAdjacentHTML('beforeend', `
                        <div class="card">
                            <button class="btn-del" style="position:absolute;top:5px;right:5px;z-index:30" onclick="window.borrar('discover','${it.id}')">×</button>
                            <a href="${it.u}" target="_blank" style="text-decoration:none;color:inherit;">
                                ${it.img ? `<img src="${it.img}" loading="lazy">` : '<div style="height:120px;background:#eee"></div>'}
                                <div class="card-body">
                                    <p class="card-title">${it.t}</p>
                                    <p class="card-meta">${it.m} | ${it.cat}</p>
                                </div>
                            </a>
                        </div>`);
                });
                return;
            }

            if (vista === 'LEIDAS') {
                g.innerHTML = '<div class="header-medio">Noticias Archivadas</div>';
                leidas.forEach(it => g.insertAdjacentHTML('beforeend', renderCard(it, true)));
                return;
            }

            // Vista RSS Principal
            for (let f of fuentesRSS) {
                try {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.u)}`);
                    const data = await res.json();
                    if (data.status === 'ok') {
                        g.insertAdjacentHTML('beforeend', `<div class="header-medio"><span>${f.n}</span><button class="btn-del" onclick="window.borrar('medios','${f.id}')">Borrar</button></div>`);
                        data.items.filter(it => !leidas.some(l => l.link === it.link)).slice(0, 10).forEach(it => {
                            const img = it.thumbnail || (it.enclosure ? it.enclosure.link : '');
                            g.insertAdjacentHTML('beforeend', renderCard({titulo: it.title, link: it.link, medio: f.n, img}, false));
                        });
                    }
                } catch (e) {}
            }
        }

        function renderCard(it, esArchivo) {
            const tSeguro = it.titulo.replace(/['"“”]/g, ' ');
            const boton = esArchivo ? `<button class="btn-accion" onclick="window.restaurar('${it.link}')">↩️</button>` : `<button class="btn-accion" onclick="window.archivar('${it.link}', '${tSeguro}', '${it.medio}', '${it.img}')">👁️</button>`;
            return `<div class="card">${boton}<a href="${it.link}" target="_blank" style="text-decoration:none; color:inherit;">${it.img ? `<img src="${it.img}" loading="lazy">` : '<div style="height:120px; background:#eee"></div>'}<div class="card-body"><p class="card-title">${it.titulo}</p></div></a></div>`;
        }

        window.archivar = (link, titulo, medio, img) => {
            if (!leidas.some(l => l.link === link)) {
                leidas.unshift({ link, titulo, medio, img });
                localStorage.setItem('q_leidas', JSON.stringify(leidas.slice(0,50)));
            }
            cargar();
        };

        window.restaurar = (link) => {
            leidas = leidas.filter(l => l.link !== link);
            localStorage.setItem('q_leidas', JSON.stringify(leidas));
            cargar();
        };

        window.borrar = async (coleccion, id) => {
            const pass = document.getElementById('admin-pass').value;
            if(!pass) return alert("Clave necesaria.");
            if(confirm("¿Eliminar permanentemente?")) await deleteDoc(doc(db, coleccion, id));
        };

        window.cambiarVista = (v) => { 
            vista = v; 
            document.getElementById('panel-rss').style.display = v === 'ALL' ? 'block' : 'none';
            document.getElementById('panel-discover').style.display = v === 'DISCOVER' ? 'block' : 'none';
            cargar(); 
        };
    </script>
</body>
</html>
